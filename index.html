    function submitUserInfo() {
      const id = document.getElementById('studentId').value.trim();
      const name = document.getElementById('studentName').value.trim();
      if (!id || !name) {
        alert("학번과 이름을 모두 입력해 주세요!");
        return;
      }
      studentInfo = { id, name };
      document.getElementById('name-modal').classList.add('hidden');
      showLessonScreen();
    }

    function showLessonScreen() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('lesson-screen').classList.remove('hidden');
    }

    function startLesson(lessonNum) {
      currentLesson = lessonNum;
      currentQuizList = lessonsData[lessonNum] || [];
      if (currentQuizList.length === 0) {
        alert(`${lessonNum}차시 본문 데이터는 준비 중입니다.`);
        return;
      }
      document.getElementById('lesson-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');
      loadQuestion(0);
    }

    function loadQuestion(index) {
      currentQIndex = index;
      const q = currentQuizList[index];
      userSelection = [];

      document.getElementById('q-number').innerText = `QUESTION ${index + 1}`;
      document.getElementById('q-progress').innerText = `${index + 1} / ${currentQuizList.length}`;
      document.getElementById('meaning-text').innerText = q.ko;

      const slotContainer = document.getElementById('slot-container');
      slotContainer.innerHTML = '';
      q.slots.forEach((s, idx) => {
        const slot = document.createElement('div');
        slot.className = 'slot-item';
        slot.id = `slot-${idx}`;
        slot.innerHTML = `
          <span class="slot-num">${idx + 1}번</span>
          <div class="slot-word"></div>
          <span class="role-badge ${s.type}">${s.label}</span>
        `;
        slot.onclick = () => removeWordFromSlot(idx);
        slotContainer.appendChild(slot);
      });

      const poolContainer = document.getElementById('pool-container');
      poolContainer.innerHTML = '';
      
      const shuffled = [...q.slots].sort(() => Math.random() - 0.5);
      
      shuffled.forEach(slotData => {
        const chip = document.createElement('button');
        chip.className = 'word-chip';
        chip.innerHTML = `
          <span class="chip-eng">${slotData.eng}</span>
          <span class="chip-kor">${slotData.kor}</span>
        `;
        chip.onclick = (e) => {
          e.preventDefault();
          selectWord(slotData.eng, chip);
        };
        poolContainer.appendChild(chip);
      });

      updateSubmitBtn();
    }

    function selectWord(engText, chipEl) {
      const q = currentQuizList[currentQIndex];
      if (userSelection.length < q.slots.length) {
        const targetSlotIdx = userSelection.length;
        userSelection.push({ eng: engText, chipEl });
        chipEl.classList.add('used');

        const slotEl = document.getElementById(`slot-${targetSlotIdx}`);
        slotEl.classList.add('filled');
        slotEl.querySelector('.slot-word').innerText = engText;
        updateSubmitBtn();
      }
    }

    function removeWordFromSlot(slotIdx) {
      if (slotIdx >= userSelection.length) return;
      for (let i = userSelection.length - 1; i >= slotIdx; i--) {
        const item = userSelection.pop();
        item.chipEl.classList.remove('used');
        const slotEl = document.getElementById(`slot-${i}`);
        slotEl.classList.remove('filled');
        slotEl.querySelector('.slot-word').innerText = '';
      }
      updateSubmitBtn();
    }

    function resetSlots() {
      removeWordFromSlot(0);
    }

    function updateSubmitBtn() {
      const btn = document.getElementById('btn-submit');
      const q = currentQuizList[currentQIndex];
      if (userSelection.length === q.slots.length) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    }

    function submitAnswer() {
      const q = currentQuizList[currentQIndex];
      if (userSelection.length < q.slots.length) return;

      const userSentence = userSelection.map(s => s.eng);
      const correctSentence = q.slots.map(s => s.eng);
      const isCorrect = userSentence.every((val, idx) => val === correctSentence[idx]);

      if (isCorrect) {
        alert("정답입니다! 👏");
        if (currentQIndex < currentQuizList.length - 1) {
          loadQuestion(currentQIndex + 1);
        } else {
          showResult();
        }
      } else {
        alert(`오답입니다.\n\n[올바른 순서]\n${correctSentence.join(' ')}`);
        resetSlots();
      }
    }

    function showResult() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');
      document.getElementById('student-info-display').innerText = `${studentInfo.id} ${studentInfo.name} 학생`;
    }
  </script>
</body>
</html>
