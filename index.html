    /* Content Area */
    .sentence-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }

    .kor-full { font-size: 18px; font-weight: bold; margin-bottom: 20px; background: #f8fafc; padding: 16px; border-left: 5px solid var(--primary); border-radius: 4px; line-height: 1.5; }

</head>

        sentences: [
          {
            kor: "당신은 하카를 본 적이 있는가?",
            chunks: [
              { kor: "1. 당신은 본 적이 있는가", eng: "Have you ever watched" },
              { kor: "2. 하카를?", eng: "the haka?" }
            ]
          },
          {
            kor: "하카를 추는 사람들이 소리를 지르고 몸을 격렬하게 움직이기 때문에 하카가 무섭게 보일지도 모른다.",
            chunks: [
              { kor: "1. 하카는 무서워 보일지도 모른다", eng: "The haka may look scary" },
              { kor: "2. 하카 무용수들이 외치기 때문에", eng: "because haka dancers shout" },
              { kor: "3. 그리고 움직이기 때문에", eng: "and move" },
              { kor: "4. 그들의 몸을 격렬하게.", eng: "their bodies wildly." }
            ]
          },
          {
            kor: "당신이 이미 들은 적 있겠지만, 마오리인들은 전쟁 춤으로 하카를 추기 시작했다.",
            chunks: [
              { kor: "1. 마오리 사람들은,", eng: "The Maori people," },
              { kor: "2. 당신이 이미 들어본 적 있는,", eng: "who you’ve already heard about," },
              { kor: "3. 하카를 추기 시작했다", eng: "started doing the haka" },
              { kor: "4. 전쟁 춤으로서.", eng: "as a war dance." }
            ]
          },
          {
            kor: "그러나 오늘날 사람들은 운동 경기나 결혼식, 다른 중요한 행사에서 하카를 춘다.",
            chunks: [
              { kor: "1. 오늘날, 그러나,", eng: "Today, however," },
              { kor: "2. 뉴질랜드인들은 하카를 춘다", eng: "New Zealanders do the haka" },
              { kor: "3. 스포츠 경기나, 결혼식,", eng: "at sport matches, weddings," },
              { kor: "4. 또는 다른 중요한 행사들에서.", eng: "or other important events." }
            ]
          },
          {
            kor: "예를 들어, 뉴질랜드의 럭비 국가 대표 팀 선수들은 모든 경기 전에 하카를 춘다.",
            chunks: [
              { kor: "1. 예를 들어,", eng: "For example," },
              { kor: "2. 뉴질랜드 국가대표 럭비팀 선수들은", eng: "New Zealand’s national rugby team members" },
              { kor: "3. 하카를 춘다", eng: "do the haka" },
              { kor: "4. 모든 경기 전에.", eng: "before every match." }
            ]
          },
          {
            kor: "그것은 전 세계적으로 유명하다.",
            chunks: [
              { kor: "1. 그것은 유명하다", eng: "It is famous" },
              { kor: "2. 전 세계적으로.", eng: "all over the world." }
            ]
          },
          {
            kor: "당신이 하카를 본다면, 상대 팀이 겁을 먹을 것이라는 것에 아마 동의할 것이다.",
            chunks: [
              { kor: "1. 만약 당신이 하카를 본다면,", eng: "If you see the haka," },
              { kor: "2. 당신은 아마 동의할 것이다", eng: "you will probably agree" },
              { kor: "3. 라이벌 팀이 겁을 먹었음에 틀림없다는 것을.", eng: "that the rival team must be scared." }
            ]
          },
          {
            kor: "키위와 마찬가지로 하카는 나라의 상징이다.",
            chunks: [
              { kor: "1. 키위 새처럼,", eng: "Like the kiwi bird," },
              { kor: "2. 하카는 국가적 상징이다.", eng: "the haka is a national symbol." }
            ]
          }
        ]
      }
    ];

    // Global State
    let currentSessionIdx = 0;
    let currentSentenceIdx = 0;
    let userPlacements = [];
    let studentId = "";
    let studentName = "";
    let timerInterval = null;
    let secondsElapsed = 0;

    function startApp() {
      const idInput = document.getElementById('student-id').value.trim();
      const nameInput = document.getElementById('student-name').value.trim();

      if (!idInput || !nameInput) {
        alert("학번과 이름을 입력해 주세요.");
        return;
      }

      studentId = idInput;
      studentName = nameInput;
      document.getElementById('user-display').innerText = `${studentId} ${studentName}`;
      document.getElementById('auth-modal').style.display = 'none';

      startTimer();
      loadSentence();
    }

    function startTimer() {
      clearInterval(timerInterval);
      secondsElapsed = 0;
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
        const secs = String(secondsElapsed % 60).padStart(2, '0');
        document.getElementById('timer-display').innerText = `⏱️ ${mins}:${secs}`;
      }, 1000);
    }

    function switchSession(idx) {
      currentSessionIdx = idx;
      currentSentenceIdx = 0;

      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach((tab, i) => {
        if (i === idx) tab.classList.add('active');
        else tab.classList.remove('active');
      });

      document.getElementById('learning-view').style.display = 'block';
      document.getElementById('result-view').style.display = 'none';

      startTimer();
      loadSentence();
    }

    function loadSentence() {
      const session = sessions[currentSessionIdx];
      const sentence = session.sentences[currentSentenceIdx];

      document.getElementById('sentence-idx').innerText = `문장 ${currentSentenceIdx + 1} / ${session.sentences.length}`;
      document.getElementById('kor-full-text').innerText = sentence.kor;

      // Reset Placements
      userPlacements = new Array(sentence.chunks.length).fill(null);

      // Render Empty Slots
      const slotsContainer = document.getElementById('slots-container');
      slotsContainer.innerHTML = '';
      sentence.chunks.forEach((chunk, idx) => {
        const slot = document.createElement('div');
        slot.className = 'slot-card';
        slot.id = `slot-${idx}`;
        slot.innerHTML = `
          <div class="slot-kor">${chunk.kor}</div>
          <div class="slot-target" id="slot-target-${idx}"></div>
        `;
        slot.onclick = () => removeChunkFromSlot(idx);
        slotsContainer.appendChild(slot);
      });

      // Render Word Bank Chips
      renderWordBank();

      // Reset Button Controls
      document.getElementById('prev-btn').disabled = (currentSentenceIdx === 0);
    }

    function renderWordBank() {
      const sentence = sessions[currentSessionIdx].sentences[currentSentenceIdx];
      const bankContainer = document.getElementById('word-bank');
      bankContainer.innerHTML = '';

      let items = sentence.chunks.map((c, originalIdx) => ({ text: c.eng, originalIdx }));
      
      // Alphabetical Shuffle
      items.sort((a, b) => a.text.localeCompare(b.text));

      items.forEach((item) => {
        if (userPlacements.includes(item.originalIdx)) return;

        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.innerText = item.text;
        chip.onclick = () => placeChunkInFirstEmptySlot(item.originalIdx);
        bankContainer.appendChild(chip);
      });
    }

    function placeChunkInFirstEmptySlot(chunkOriginalIdx) {
      const emptySlotIdx = userPlacements.findIndex(p => p === null);
      if (emptySlotIdx === -1) return;

      userPlacements[emptySlotIdx] = chunkOriginalIdx;
      updateSlotsUI();
      renderWordBank();
    }

    function removeChunkFromSlot(slotIdx) {
      if (userPlacements[slotIdx] === null) return;
      userPlacements[slotIdx] = null;
      updateSlotsUI();
      renderWordBank();
    }

    function updateSlotsUI() {
      const sentence = sessions[currentSessionIdx].sentences[currentSentenceIdx];
      userPlacements.forEach((placedChunkIdx, slotIdx) => {
        const slotCard = document.getElementById(`slot-${slotIdx}`);
        const slotTarget = document.getElementById(`slot-target-${slotIdx}`);

        if (placedChunkIdx !== null) {
          slotCard.classList.add('filled');
          slotTarget.innerText = sentence.chunks[placedChunkIdx].eng;
        } else {
          slotCard.classList.remove('filled');
          slotTarget.innerText = '';
        }
      });
    }

    function resetCurrentSentence() {
      const sentence = sessions[currentSessionIdx].sentences[currentSentenceIdx];
      userPlacements = new Array(sentence.chunks.length).fill(null);
      updateSlotsUI();
      renderWordBank();
    }

    function checkAnswer() {
      if (userPlacements.includes(null)) {
        alert("모든 단어 조각을 상단 칸에 배치해 주세요!");
        return;
      }

      let isCorrect = true;
      userPlacements.forEach((placedIdx, slotIdx) => {
        if (placedIdx !== slotIdx) isCorrect = false;
      });

      if (isCorrect) {
        alert("🎉 정답입니다!");
      } else {
        alert("❌ 순서가 올바르지 않습니다. 다시 배열해 보세요.");
      }
    }

    function prevSentence() {
      if (currentSentenceIdx > 0) {
        currentSentenceIdx--;
        loadSentence();
      }
    }

    function nextSentence() {
      const session = sessions[currentSessionIdx];
      if (currentSentenceIdx < session.sentences.length - 1) {
        currentSentenceIdx++;
        loadSentence();
      } else {
        showResults();
      }
    }

    function showResults() {
      clearInterval(timerInterval);
      document.getElementById('learning-view').style.display = 'none';
      document.getElementById('result-view').style.display = 'block';

      const session = sessions[currentSessionIdx];
      document.getElementById('report-session-title').innerText = `${session.title} 완료 보고서`;
      document.getElementById('report-id').innerText = studentId;
      document.getElementById('report-name').innerText = studentName;

      const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const secs = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('report-time').innerText = `${mins}분 ${secs}초`;
      document.getElementById('report-score').innerText = `${session.sentences.length} / ${session.sentences.length} 문장 완료`;

      const today = new Date();
      document.getElementById('report-date').innerText = today.toLocaleString('ko-KR');
    }

    function downloadCapture() {
      const captureArea = document.getElementById('capture-area');
      html2canvas(captureArea).then(canvas => {
        const link = document.createElement('a');
        link.download = `${studentId}_${studentName}_차시${currentSessionIdx + 1}_학습결과.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    function restartSession() {
      switchSession(currentSessionIdx);
    }
  </script>
</body>
</html>
